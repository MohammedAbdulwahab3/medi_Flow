{% extends "base.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-11 col-md-9 col-lg-7">
        <div class="elevated-card p-4">
          <h3 class="mb-2 fw-semibold">Create your MediFlow account</h3>
          <p class="text-muted mb-4">Quickly create an account to search medicines, view availability and manage prescriptions.</p>

          <form method="post" novalidate class="vstack gap-3">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-gradient-primary btn-lg w-100">Create account</button>
          </form>

          <div class="mt-3 text-center">
            <small class="text-muted">Already have an account? <a href="{% url 'authentication:login' %}">Sign in</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
