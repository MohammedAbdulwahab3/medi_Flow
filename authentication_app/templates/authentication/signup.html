{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
    <div class="card shadow-lg" style="max-width:560px; width:100%;">
      <div class="card-body p-4">
        <h3 class="card-title mb-2">Create your MediFlow account</h3>
        <p class="text-muted mb-4">Quickly create an account to search medicines, view availability and manage prescriptions.</p>

        <form method="post" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">Create account</button>
          </div>
        </form>

        <div class="mt-3 text-center">
          <small class="text-muted">Already have an account? <a href="{% url 'authentication:login' %}">Sign in</a></small>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
