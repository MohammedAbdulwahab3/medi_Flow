{% extends "base.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-5">
        <div class="elevated-card p-4">
          <h3 class="mb-2 fw-semibold">Welcome back</h3>
          <p class="text-muted mb-4">Sign in to access your dashboard and manage prescriptions.</p>

          <form method="post" novalidate class="vstack gap-3">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-gradient-primary btn-lg w-100">Sign in</button>
          </form>

          <div class="mt-3 text-center">
            <small class="text-muted">Don't have an account? <a href="{% url 'authentication:signup' %}">Create one</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
