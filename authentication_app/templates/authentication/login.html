{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
    <div class="card shadow-lg" style="max-width:420px; width:100%;">
      <div class="card-body p-4">
        <h3 class="card-title mb-3">Welcome back</h3>
        <p class="text-muted mb-4">Sign in to access your dashboard and manage prescriptions.</p>

        <form method="post" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
          </div>
        </form>

        <div class="mt-3 text-center">
          <small class="text-muted">Don't have an account? <a href="{% url 'authentication:signup' %}">Create one</a></small>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
