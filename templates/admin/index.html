{% extends "admin/base_site.html" %}
{% load i18n admin_list static %}

{% block admin_content %}
  <div class="row g-4">
    {% for app in app_list %}
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5 class="mb-1">{{ app.name }}</h5>
              <small class="text-muted">{{ app.app_url }}</small>
            </div>
            <div>
              <a href="{{ app.app_url }}" class="btn btn-sm btn-outline-primary">Open</a>
            </div>
          </div>
          <div class="mt-3">
            <ul class="list-unstyled mb-0">
              {% for model in app.models %}
                <li>
                  <a href="{{ model.admin_url }}">{{ model.name }}</a>
                </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
