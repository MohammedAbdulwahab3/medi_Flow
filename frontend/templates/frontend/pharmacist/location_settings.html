{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">Pharmacy Location</h1>
        <a class="btn btn-outline-secondary" href="{% url 'frontend:pharmacist_dashboard' %}">Dashboard</a>
    </div>
    <form method="post" class="card p-3">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Pharmacy Name</label>
                <input name="pharmacy_name" class="form-control" value="{{ profile.pharmacy_name }}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control" value="{{ profile.phone }}" />
            </div>
            <div class="col-12">
                <label class="form-label">Address</label>
                <input name="address" class="form-control" value="{{ profile.address }}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Latitude</label>
                <input name="latitude" class="form-control" value="{{ profile.latitude }}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Longitude</label>
                <input name="longitude" class="form-control" value="{{ profile.longitude }}" />
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-primary" type="submit">Save</button>
        </div>
    </form>
</div>
{% endblock %}
