{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Medicine Details</h5>
      <a href="{% url 'frontend:medicine_list' %}" class="btn btn-sm btn-secondary">Back</a>
    </div>
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">ID</dt>
        <dd class="col-sm-9">{{ id }}</dd>

        <dt class="col-sm-3">Name</dt>
        <dd class="col-sm-9">{{ name }}</dd>

        <dt class="col-sm-3">Generic Name</dt>
        <dd class="col-sm-9">{{ generic_name }}</dd>

        <dt class="col-sm-3">Strength</dt>
        <dd class="col-sm-9">{{ strength }}</dd>

        <dt class="col-sm-3">Dosage Form</dt>
        <dd class="col-sm-9">{{ dosage_form }}</dd>

        <dt class="col-sm-3">Status</dt>
        <dd class="col-sm-9">{% if is_active %}<span class="badge bg-success">Active</span>{% else %}<span class="badge bg-secondary">Inactive</span>{% endif %}</dd>

        <dt class="col-sm-3">Created</dt>
        <dd class="col-sm-9">{{ created_at }}</dd>
      </dl>
    </div>
  </div>
</div>
{% endblock %}
