{% extends "base.html" %}
{% block content %}
<!-- Sidebar -->
<nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#">
                    <i class="fas fa-user"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'prescription:patient_mine' %}">
                    <i class="fas fa-prescription"></i> My Prescriptions
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'prescription:patient_history' %}">
                    <i class="fas fa-history"></i> History
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'frontend:medicine_catalog' %}">
                    <i class="fas fa-pills"></i> Medicines
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- Main content -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Patient Dashboard</h1>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-prescription"></i> Recent Prescriptions</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">No recent prescriptions found.</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-user-md"></i> My Doctors</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">No doctors assigned yet.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
.sidebar .nav-link {
    font-weight: 500;
    color: #333;
    padding: 0.75rem 1rem;
    border-radius: 0.25rem;
    margin: 0.125rem 0.5rem;
}

.sidebar .nav-link:hover {
    color: #007bff;
    background-color: #f8f9fa;
}

.sidebar .nav-link.active {
    color: #007bff;
    background-color: #e3f2fd;
}

.card {
    box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
    border: none;
    border-radius: 0.35rem;
}
</style>
{% endblock %}
